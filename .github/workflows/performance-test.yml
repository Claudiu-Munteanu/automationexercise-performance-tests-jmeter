name: JMeter Performance Test

on:
  workflow_dispatch:

jobs:
  run-jmeter-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup JMeter
        run: |
          JMETER_VERSION="5.6.3"
          wget https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-${JMETER_VERSION}.tgz
          tar -xzf apache-jmeter-${JMETER_VERSION}.tgz
          echo "JMETER_HOME=$PWD/apache-jmeter-${JMETER_VERSION}" >> $GITHUB_ENV

      - name: Run JMeter Test
        run: |
          # Clean up old results and create the necessary directories
          rm -rf target/
          mkdir -p target/reports
          
          # Execute the JMeter test directly
          $JMETER_HOME/bin/jmeter \
            -n \
            -t "src/test/jmeter/Automation Exercise - Performance Tests - JMeter.jmx" \
            -l "target/results/test-results.jtl" \
            -e \
            -o "target/reports"

      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-html-report
          path: target/reports/