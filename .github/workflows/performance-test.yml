name: JMeter Performance Test

on:
  workflow_dispatch:
    inputs:
      threads:
        description: 'Number of Threads (users)'
        required: true
        default: '50'
      rampup_time:
        description: 'Ramp-up period (seconds)'
        required: true
        default: '5'
      loop_count:
        description: 'Loop Count'
        required: true
        default: '1'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  run-jmeter-tests:
    env:
      JMETER_VERSION: 5.6.3
    environment: jmeter-report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Cache JMeter
        id: jmeter-cache
        uses: actions/cache@v4
        with:
          path: apache-jmeter-${{ env.JMETER_VERSION }}
          key: ${{ runner.os }}-jmeter-${{ env.JMETER_VERSION }}

      - name: Setup JMeter
        if: steps.jmeter-cache.outputs.cache-hit != 'true'
        run: |
          wget https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-${{ env.JMETER_VERSION }}.tgz
          tar -xzf apache-jmeter-${{ env.JMETER_VERSION }}.tgz

      - name: Set JMETER_HOME
        run: echo "JMETER_HOME=$PWD/apache-jmeter-${{ env.JMETER_VERSION }}" >> $GITHUB_ENV

      - name: Run JMeter Test
        run: |
          rm -rf target/
          mkdir -p target/results
          mkdir -p target/reports
          $JMETER_HOME/bin/jmeter \
            -n \
            -t "src/test/jmeter/Automation Exercise - Performance Tests - JMeter.jmx" \
            -Jthreads=${{ github.event.inputs.threads }} \
            -Jrampup=${{ github.event.inputs.rampup_time }} \
            -Jloops=${{ github.event.inputs.loop_count }} \
            -l "target/results/test-results.jtl" \
            -e \
            -o "target/reports"

      - name: Archive JMeter report
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-report-artifact
          path: target/reports

  publish-report-to-pages:
    needs: run-jmeter-tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download new report artifact
        uses: actions/download-artifact@v4
        with:
          name: jmeter-report-artifact
          path: public/reports/${{ github.run_id }}

      - name: Generate index of reports
        run: |
          # This step will only run if there are existing reports to index
          # It creates the main index.html that links to all reports
          cd public
          echo "<html><head><title>JMeter Reports</title><style>body { font-family: sans-serif; margin: 2em; } ul { list-style-type: none; padding-left: 0; } li { margin: 0.5em 0; } a { text-decoration: none; color: #0366d6; } a:hover { text-decoration: underline; }</style></head><body><h1>JMeter Test Reports</h1><ul>" > public/index.html
          for report in $(ls -d reports/*/ | xargs -n 1 basename | sort -rn); do
            echo "<li><a href='reports/$report/index.html'>Run #$report</a></li>" >> public/index.html
          done
          echo "</ul></body></html>" >> index.html
        if: ${{ always() }}

      - name: Deploy site
        id: deployment
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true