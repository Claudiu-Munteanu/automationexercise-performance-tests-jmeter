# JMeter Custom User Properties for Automation Exercise Project

## General Settings
CookieManager.save.cookies=true

## HTML Report Customization
# Sets the main title on the dashboard report.
jmeter.reportgenerator.report_title=Automation Exercise - Performance Report

# APDEX thresholds for user satisfaction (Satisfied < 750ms, Tolerable < 2s).
jmeter.reportgenerator.apdex_satisfied_threshold=750
jmeter.reportgenerator.apdex_tolerated_threshold=2000

# Granularity for graphs in milliseconds (e.g., 10000 = 10-second intervals).
jmeter.reportgenerator.overall_granularity=10000